<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuestionarios Parciales UBA XXI</title>
<meta name="description" content="Practicá con parciales reales de UBA XXI: respondé, mirá la corrección y por qué cada opción es correcta o no.">
<meta name="theme-color" content="#12161c">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Parciales UBA XXI">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="iconos/icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
<style>
/* ---------- colores: todo oscuro, sin blancos puros ---------- */
:root{
  --paper:#12161c; --surface:#1a2029; --surface-2:#202833;
  --ink:#d6dce3; --ink-soft:#8d98a5; --ink-faint:#5f6a77;
  --line:#2a3340; --line-soft:#222a35;
  --pick:#86a6e0; --pick-soft:#1d2a42;
  --ok:#6cc497; --ok-soft:#16302a;
  --bad:#e3897e; --bad-soft:#36211f;
  --note:#d4bf7d; --note-soft:#28241a;
  --serif:Georgia, "Noto Serif", "Iowan Old Style", "Times New Roman", serif;
  --sans:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", Helvetica, Arial, sans-serif;
  --acento:#86a6e0;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{background:var(--paper)}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:17px; line-height:1.5;
  -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit}
.wrap{
  max-width:740px;margin:0 auto;
  padding:calc(12px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
}

/* ---------- barra superior ---------- */
.barra{display:flex;align-items:center;gap:8px;min-height:40px;margin-bottom:10px}
.barra[hidden]{display:none}
.volver{
  background:none;border:none;color:var(--pick);cursor:pointer;padding:6px 4px;
  font-size:.92rem;display:flex;align-items:center;gap:2px;max-width:60%;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.volver[hidden]{display:none}

h1{font-family:var(--serif);font-weight:600;font-size:1.42rem;line-height:1.22;margin:0 0 4px}
.sub{margin:0 0 16px;color:var(--ink-soft);font-size:.88rem}
.aviso-tema{display:flex;gap:7px;align-items:flex-start;margin:-6px 0 14px;color:var(--note);font-size:.82rem;line-height:1.4}
.aviso-tema .ico{margin-top:.05em}

/* ---------- listas (materias y exámenes) ---------- */
.lista{display:flex;flex-direction:column;gap:10px}
.item{
  display:block;width:100%;text-align:left;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 15px;
}
.item:hover{border-color:var(--pick)}
.item .t{font-family:var(--serif);font-size:1.12rem;font-weight:600;margin:0 0 2px}
.item .d{color:var(--ink-soft);font-size:.85rem;margin:0}
.examen{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px}
.examen .t{display:flex;gap:8px;align-items:center;font-family:var(--serif);font-size:1.06rem;font-weight:600;margin:0}
.examen .t .ico{color:var(--pick)}
.examen .d{color:var(--ink-soft);font-size:.83rem;margin:2px 0 10px}
.temas{display:flex;flex-wrap:wrap;gap:7px}
.temas button{
  cursor:pointer;font-size:.88rem;padding:7px 12px;border-radius:999px;
  background:var(--surface-2);border:1px solid var(--line);color:var(--ink);
  display:flex;gap:6px;align-items:center;
}
.temas button .ico{width:1em;height:1em}
.temas button.ok .ico{color:var(--ok)} .temas button.bad .ico{color:var(--bad)}
.temas button:hover{border-color:var(--pick)}
.temas small{font-size:.75rem;color:var(--ink-soft)}
.temas button.ok{border-color:var(--ok)} .temas button.ok small{color:var(--ok)}
.temas button.bad{border-color:var(--bad)} .temas button.bad small{color:var(--bad)}

/* ---------- grilla de ejercicios ---------- */
.grilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;margin:0 0 14px}
.grilla button{
  font-size:.82rem;padding:8px 0;border-radius:8px;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);color:var(--ink-soft);
}
.grilla button.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.grilla button.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.grilla button.parcial{border-color:var(--pick);color:var(--pick)}
.grilla button.now{outline:2px solid var(--pick);outline-offset:1px;color:var(--ink)}
.grilla button.fin{font-size:.75rem;display:flex;gap:3px;align-items:center;justify-content:center}

/* ---------- tarjeta de la consigna ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px 14px}
.meta{display:flex;justify-content:space-between;gap:10px;align-items:baseline;color:var(--ink-soft);font-size:.8rem;margin-bottom:9px}
.ctx{margin:0 0 13px;border:1px solid var(--line-soft);background:var(--surface-2);border-radius:9px;padding:0 12px}
.ctx summary{cursor:pointer;color:var(--ink-soft);font-size:.82rem;padding:9px 0;list-style:none;display:flex;gap:7px;align-items:center}
.ctx summary::-webkit-details-marker{display:none}
.ctx summary .ico{color:var(--pick)}
.ctx summary .chev{margin-left:auto;color:var(--ink-faint);transition:transform .2s}
.ctx[open] summary .chev{transform:rotate(90deg)}
.ctx p{margin:0 0 11px;font-family:var(--serif);font-size:.95rem;line-height:1.45;color:var(--ink)}
.enun{font-family:var(--serif);font-size:1.05rem;line-height:1.45;margin:0 0 14px}
.enun,.op .t,.porque .exp>span{white-space:pre-line}
.ayuda{color:var(--ink-soft);font-size:.8rem;margin:-6px 0 12px}
.parte{margin:0 0 14px}
.parte:last-of-type{margin-bottom:0}
.rot{font-size:.84rem;font-weight:600;color:var(--ink-soft);margin:0 0 7px}
.ops{display:flex;flex-direction:column;gap:7px}
.op{
  display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;
  font-family:var(--serif);font-size:.97rem;line-height:1.42;
  background:var(--surface-2);color:var(--ink);border:1px solid var(--line);
  border-radius:9px;padding:10px 12px;cursor:pointer;
}
.op:hover:not(:disabled){border-color:var(--pick)}
.op:disabled{cursor:default}
.op .l{font-family:var(--sans);font-size:.8rem;font-weight:600;color:var(--ink-soft);min-width:1.1em;padding-top:.15em}
.op.sel{background:var(--pick-soft);border-color:var(--pick)}
.op.sel .l{color:var(--pick)}
.op.ok{background:var(--ok-soft);border-color:var(--ok)}
.op.ok .l{color:var(--ok)}
.op.bad{background:var(--bad-soft);border-color:var(--bad)}
.op.bad .l{color:var(--bad)}
.op.resto{opacity:.72}
.porque{margin-top:14px;border-left:3px solid var(--note);background:var(--note-soft);border-radius:0 8px 8px 0;padding:11px 13px;font-size:.93rem}
.porque b{display:flex;gap:6px;align-items:center;font-size:.84rem;letter-spacing:.02em;margin-bottom:7px}
.porque .exp{display:flex;gap:8px;align-items:flex-start}
.porque .exp .ico{margin-top:.1em}
.porque b.ok{color:var(--ok)} .porque b.bad{color:var(--bad)}
.dudosa{display:flex;gap:7px;align-items:flex-start;margin-top:10px;font-size:.84rem;color:var(--note);border-top:1px dashed var(--line);padding-top:9px}
.nav{display:flex;gap:8px;margin-top:16px}
.nav button{
  flex:1;display:flex;gap:6px;align-items:center;justify-content:center;font-size:.95rem;padding:12px;border-radius:10px;cursor:pointer;
  background:var(--surface-2);border:1px solid var(--line);color:var(--ink);
}
.nav button.main{background:var(--pick-soft);border-color:var(--pick);color:var(--ink)}
.nav button:disabled{opacity:.4;cursor:default}

/* ---------- resultado ---------- */
.score{text-align:center;padding:24px 16px}
.score .n{font-family:var(--serif);font-size:3.3rem;line-height:1;margin:0}
.score .n small{font-size:1.15rem;color:var(--ink-soft)}
.score .verd{font-family:var(--serif);font-size:1.1rem;margin:10px 0 0}
.score .verd.ok{color:var(--ok)} .score .verd.bad{color:var(--bad)}
.score p{color:var(--ink-soft);margin:8px 0 0;font-size:.92rem}

/* ---------- pie, avisos ---------- */
footer{margin-top:20px;color:var(--ink-faint);font-size:.78rem;line-height:1.5}
footer p{margin:0 0 6px}
.enlace{display:inline-flex;gap:5px;align-items:center;font-size:.8rem;background:none;border:none;color:var(--pick);cursor:pointer;padding:0;text-decoration:underline}
.enlace[hidden]{display:none}
.acciones-resumen{display:flex;flex-wrap:wrap;gap:12px 24px;margin-top:16px}
.acciones-resumen .enlace{min-height:44px;font-size:.95rem}
.limpieza{margin-top:18px}
.limpieza button{
  display:inline-flex;align-items:center;gap:6px;font-size:.8rem;padding:8px 11px;
  border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink-soft);cursor:pointer;
}
.limpieza button:hover{border-color:var(--bad);color:var(--bad)}
.limpieza button:disabled{opacity:.5;cursor:wait}
.limpieza p{font-size:.8rem;color:var(--ink-soft);margin:7px 0 0}
.error{color:var(--bad)}
/* ---------- firma: leyenda al final de todas las pantallas ---------- */
.firma{
  margin-top:26px;padding-top:16px;border-top:1px solid var(--line-soft);
  display:flex;gap:11px;align-items:center;color:var(--ink-soft);font-size:.82rem;line-height:1.45;
}
.firma .gato{
  flex:none;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  color:var(--note);background:var(--note-soft);border:1px solid rgba(212,191,125,.35);
}
.firma .gato .ico{width:26px;height:26px}
.firma p{margin:0}
.firma a{color:var(--note);font-weight:600;text-decoration:none;display:inline-flex;gap:4px;align-items:center;white-space:nowrap}
.firma a:hover,.firma a:focus-visible{text-decoration:underline}
.firma a .ico{width:1em;height:1em}
.aviso-nueva{
  position:fixed;left:0;right:0;bottom:0;z-index:10;
  background:var(--surface-2);border-top:1px solid var(--pick);
  padding:12px calc(16px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;font-size:.92rem;
}
.aviso-nueva[hidden]{display:none}
.aviso-nueva button{border-radius:9px;padding:8px 15px;cursor:pointer;border:1px solid var(--line);background:var(--surface)}
.aviso-nueva button.main{background:var(--pick-soft);border-color:var(--pick)}
/* ---------- íconos ---------- */
.ico{display:inline-flex;flex:none;width:1.2em;height:1.2em;vertical-align:-.22em}
.ico svg{width:100%;height:100%}
.c-pick{color:var(--pick)} .c-note{color:var(--note)} .c-ok{color:var(--ok)} .c-bad{color:var(--bad)}
.icobox{
  flex:none;width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  color:var(--acento);background:var(--surface-2);border:1px solid var(--line);
  background:color-mix(in srgb, var(--acento) 15%, var(--surface));
  border-color:color-mix(in srgb, var(--acento) 45%, transparent);
}
.icobox .ico{width:30px;height:30px}

/* ---------- inicio ---------- */
.hero{display:flex;gap:13px;align-items:center;margin:0 0 12px}
.hero img{width:56px;height:56px;border-radius:15px;flex:none}
.hero h1{margin:0}
.hero .sub{margin:3px 0 0}
.rasgos{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.rasgos span{
  display:inline-flex;gap:6px;align-items:center;font-size:.8rem;color:var(--ink-soft);
  background:var(--surface);border:1px solid var(--line-soft);border-radius:999px;padding:4px 11px 4px 9px;
}
.seccion{font-size:.8rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);margin:4px 0 10px}
.materia{display:flex;gap:13px;align-items:center}
.materia .cuerpo{flex:1;min-width:0}
.materia .t,.materia .d{display:block}
.materia .chev{color:var(--ink-faint)}
.prog{display:block;height:5px;border-radius:3px;background:var(--line-soft);margin-top:9px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--acento);border-radius:3px;transition:width .4s}
.cab-materia{display:flex;gap:13px;align-items:center;margin:0 0 16px}
.cab-materia h1{margin:0}
.cab-materia .sub{margin:3px 0 0}

/* ---------- cartel para instalar ---------- */
.instalar{
  margin:0 0 20px;padding:15px 14px;border:1.5px solid var(--pick);border-radius:14px;
  background:linear-gradient(135deg, var(--pick-soft), var(--surface) 75%);
  box-shadow:0 0 0 4px rgba(134,166,224,.07);
}
.inst-cab{display:flex;gap:12px;align-items:flex-start}
.inst-ico{flex:none;width:46px;height:46px;border-radius:12px;background:var(--pick);color:var(--paper);display:flex;align-items:center;justify-content:center}
.inst-ico.ok{background:var(--ok)}
.inst-ico .ico{width:27px;height:27px}
.inst-cab b{display:block;font-size:1.04rem;line-height:1.3}
.inst-cab small{display:block;color:var(--ink-soft);font-size:.86rem;margin-top:3px;line-height:1.4}
.inst-ventajas{display:flex;flex-wrap:wrap;gap:5px 14px;margin:11px 0 0;padding:0;list-style:none;font-size:.8rem;color:var(--ink-soft)}
.inst-ventajas li{display:inline-flex;gap:5px;align-items:center}
.inst-ventajas .ico{color:var(--pick)}
.inst-acc{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}
.btn-inst{
  flex:1 1 auto;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--pick);color:var(--paper);border:none;border-radius:10px;padding:12px 16px;
  font-weight:600;font-size:.98rem;cursor:pointer;text-decoration:none;
}
.btn-inst:hover{filter:brightness(1.08)}
.btn-sec{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  background:transparent;border:1px solid var(--line);border-radius:10px;padding:11px 14px;color:var(--ink-soft);cursor:pointer;
}
.inst-ayuda{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;font-size:.9rem}
.inst-ayuda p{margin:0 0 8px;color:var(--ink-soft)}
.pasos{list-style:none;counter-reset:paso;padding:0;margin:0 0 10px}
.pasos li{counter-increment:paso;display:flex;gap:10px;align-items:flex-start;margin:0 0 10px}
.pasos li::before{
  content:counter(paso);flex:none;width:24px;height:24px;border-radius:50%;
  background:var(--pick-soft);border:1px solid var(--pick);color:var(--pick);font-weight:700;font-size:.8rem;
  display:flex;align-items:center;justify-content:center;
}
.pasos .ico{color:var(--pick)}
.link-copia{width:100%;background:var(--paper);color:var(--ink);font:inherit;font-size:.85rem;border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin:2px 0 8px}

/* ---------- resultado ---------- */
.medalla{width:60px;height:60px;margin:0 auto 12px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--line)}
.medalla .ico{width:32px;height:32px}
.medalla.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.medalla.top{background:var(--note-soft);color:var(--note);border-color:var(--note)}
.medalla.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
:focus-visible{outline:2px solid var(--pick);outline-offset:2px}
@media (max-width:420px){ .enun{font-size:1rem} .op{font-size:.94rem} }
</style>
</head>
<body>
<div class="wrap">
  <div class="barra">
    <button class="volver" id="volver" hidden></button>
  </div>
  <main id="vista"></main>
  <footer id="pie"></footer>
  <div class="firma" id="firma"></div>
</div>

<div class="aviso-nueva" id="aviso-nueva" role="status" hidden>
  <span>Hay una versión nueva con cambios en los cuestionarios.</span>
  <button class="main" id="btn-actualizar">Actualizar</button>
  <button id="btn-despues">Después</button>
</div>

<script src="materias/indice.js"></script>
<script src="resumenes/indice.js"></script>
<script>
"use strict";
/* ============================================================
   CUESTIONARIOS PARCIALES UBA XXI
   ------------------------------------------------------------
   Los datos no están acá: cada materia vive en materias/<id>.js y
   se registra llamando a registrarMateria({...}). La lista de
   materias está en materias/indice.js.

   Pantallas (en la dirección, después del #):
     #/                         lista de materias
     #/ipc                      selección de parcial (si hay más de uno)
     #/ipc/parcial/1            exámenes y temas del primer parcial
     #/filosofia/<examen>/<tema>/<n>   ejercicio n (o "fin" = resultado)

   Todo el texto que viene de los parciales se inserta con
   textContent, nunca con innerHTML.
   ============================================================ */

const L = "ABCDEFGH";
const CLAVE = "cuestionarios-uba-xxi";           // NO CAMBIAR: ahí está guardado el progreso
const MATERIAS = {};                              // id → datos, a medida que se cargan
const cargando = {};                              // id → promesa de carga

/* ---------- datos guardados en el dispositivo ---------- */
let GUARDADO = {resp: {}, instalada: false};
try {
  const v = JSON.parse(localStorage.getItem(CLAVE));
  if (v && typeof v === "object") {
    if (v.resp && typeof v.resp === "object") GUARDADO.resp = v.resp;
    GUARDADO.instalada = v.instalada === true;     // ya la instaló desde este navegador
  }
} catch(e) {}
function guardar(){
  try { localStorage.setItem(CLAVE, JSON.stringify(GUARDADO)); } catch(e) {}
}

/* ---------- registro y carga de materias ---------- */
function registrarMateria(m){
  MATERIAS[m.id] = m;
  m.examenes.forEach(ex => ex.temas.forEach(t => { t._ex = ex; t._clave = m.id + "/" + ex.id + "/" + t.id; }));
}
function cargarMateria(id){
  if (MATERIAS[id]) return Promise.resolve(MATERIAS[id]);
  if (cargando[id]) return cargando[id];
  const info = CATALOGO.find(c => c.id === id);
  if (!info) return Promise.reject(new Error("No existe la materia " + id));
  cargando[id] = new Promise((ok, mal) => {
    const s = document.createElement("script");
    s.src = info.archivo;
    s.onload = () => MATERIAS[id] ? ok(MATERIAS[id]) : mal(new Error("El archivo no registró la materia"));
    s.onerror = () => { delete cargando[id]; s.remove(); mal(new Error("No se pudo cargar " + info.archivo)); };
    document.head.appendChild(s);
  });
  return cargando[id];
}

/* ---------- respuestas ----------
   Por cada tema se guarda un array con una entrada por consigna:
     null                 sin responder
     número               consigna simple: índice elegido
     [número|null, …]     consigna con columnas: índice elegido en cada una
   Al cargar se reconcilia con los datos actuales: lo que no calza se reinicia,
   así una corrección de opciones nunca deja una respuesta apuntando a la nada. */
const vacia = () => null;
function valida(q, r){
  if (r === null) return true;
  if (q.elegir) return Array.isArray(r) && r.length >= 1 && r.length <= q.elegir && new Set(r).size === r.length &&
    r.every(x => Number.isInteger(x) && x >= 0 && x < q.o.length);
  if (q.partes) return Array.isArray(r) && r.length === q.partes.length &&
    r.every((x, j) => x === null || (Number.isInteger(x) && x >= 0 && x < q.partes[j].o.length));
  return Number.isInteger(r) && r >= 0 && r < q.o.length;
}
function respuestas(t){
  let r = GUARDADO.resp[t._clave];
  if (!Array.isArray(r) || r.length !== t.qs.length) r = t.qs.map(vacia);
  else r = r.map((x, i) => valida(t.qs[i], x) ? x : null);
  GUARDADO.resp[t._clave] = r;
  return r;
}
/* Consigna «elegir varias» (q.elegir = cuántas, q.correctas = índices):
   la respuesta es la lista de opciones marcadas y se corrige al completar
   la cantidad pedida. Vale solo si coinciden todas, en cualquier orden. */
const completa = (q, r) => r !== null && (q.elegir ? r.length === q.elegir : (!q.partes || r.every(x => x !== null)));
const indiceCorrecto = (b, i) => (b.correctas || b.aceptadas || [b.c]).includes(i);
const correcta = (q, r) => completa(q, r) && (q.elegir ? r.every(i => q.correctas.includes(i))
  : q.partes ? q.partes.every((p, j) => indiceCorrecto(p, r[j])) : indiceCorrecto(q, r));
function resumen(t){
  const r = respuestas(t);
  let hechas = 0, bien = 0, puntos = 0, total = 0;
  t.qs.forEach((q, i) => {

function el(tag, props, ...hijos){
  const e = document.createElement(tag);
  if (props) for (const k in props) {
    if (k === "class") e.className = props[k];
    else if (k === "text") e.textContent = props[k];
    else if (k.startsWith("on")) e[k] = props[k];
    else if (props[k] !== null && props[k] !== false) e.setAttribute(k, props[k]);
  }
  hijos.flat().forEach(h => { if (h != null) e.appendChild(typeof h === "string" ? document.createTextNode(h) : h); });
  return e;
}

/* Pantallas recorridas en esta sesión (inicio, materia, parcial o tema).
   Sirve para que "‹ volver" use el historial cuando la pantalla de arriba es la
   anterior: así el botón atrás del teléfono sigue siendo coherente. */
const pila = [];
const nivel = h => h.replace(/^#\/?/, "").split("/").filter(Boolean).slice(0, 3).join("/");
function barra(texto, hash){
  $volver.parentElement.hidden = !texto;
  if (!texto) { $volver.hidden = true; return; }
  $volver.hidden = false;
  $volver.innerHTML = "";
  $volver.appendChild(ico("atras"));
  $volver.appendChild(document.createTextNode(texto));
  $volver.onclick = () => {
    if (pila.length >= 2 && pila[pila.length - 2] === nivel(hash)) history.back(); else ir(hash);
  };
}

/* ---------- pantallas ---------- */
let ultimaRuta = null;
function pintar(){
  const partes = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean).map(decodeURIComponent);
  const n = nivel(location.hash);
  if (pila.length >= 2 && pila[pila.length - 2] === n) pila.pop();
  else if (pila[pila.length - 1] !== n) pila.push(n);
  // al cambiar de pantalla o de ejercicio se sube; al responder, no (para ver la explicación)
  const mover = partes.join("/") !== ultimaRuta;
  ultimaRuta = partes.join("/");
  $pie.innerHTML = "";
  if (!partes.length) { pintarInicio(); if (mover) window.scrollTo(0, 0); return; }
  cargarMateria(partes[0]).then(m => {
    if (partes[1] === "resumenes") pintarResumenes(m, partes[2] === undefined ? undefined : Number(partes[2]));
    else if (partes[1] === "parcial" && partes.length === 3) pintarMateria(m, Number(partes[2]));
    else if (partes.length < 3) pintarMateria(m);
    else {
      const ex = m.examenes.find(e => e.id === partes[1]);
      const t = ex && ex.temas.find(t => t.id === partes[2]);
      if (!t) return ir("#/" + m.id, true);
      pintarTema(m, t, partes[3]);
    }
    if (mover) window.scrollTo(0, 0);
  }).catch(err => {
    barra("Materias", "#/");
    $vista.innerHTML = "";
    $vista.appendChild(el("p", {class: "error", text: err.message}));
  });
}

/* Borra solamente los datos de esta app. Otros proyectos de GitHub Pages
   pueden compartir el mismo origen, por eso no se usa localStorage.clear(). */
let borrandoTodo = false;
async function borrarTodo(){
  if (borrandoTodo || !confirm("¿Borrar la caché de la aplicación y TODAS las respuestas de TODOS los parciales y materias?\n\nEsta acción no se puede deshacer. Para volver a descargar la app para usarla sin conexión, necesitás abrirla con internet.")) return;
  borrandoTodo = true;
  const boton = document.getElementById("borrar-todo");
  const estado = document.getElementById("estado-limpieza");
  boton.disabled = true;
  estado.textContent = "Borrando caché y respuestas…";
  try {
    if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
      const scope = new URL("./", location.href).href;
      const registros = (await navigator.serviceWorker.getRegistrations()).filter(r => r.scope === scope);
      const workers = new Set(registros.flatMap(r => [r.active, r.waiting, r.installing]).filter(Boolean));
      // Impide que un worker activo o en instalación vuelva a llenar la caché
      // mientras se borra. El plazo también permite limpiar versiones viejas.
      await Promise.all(Array.from(workers, w => new Promise(resolve => {
        const canal = new MessageChannel();
        const terminar = () => { clearTimeout(plazo); canal.port1.close(); resolve(); };
        const plazo = setTimeout(terminar, 1500);
        canal.port1.onmessage = terminar;
        try { w.postMessage({tipo: "borrar-cache"}, [canal.port2]); } catch(e) { terminar(); }
      })));
      await Promise.all(registros.map(r => r.unregister()));
    }
    if ("caches" in window && /^https?:$/.test(location.protocol)) {
      const claves = await caches.keys();
      await Promise.all(claves.filter(k => k.startsWith("cuestionarios-uba-xxi-")).map(k => caches.delete(k)));
    }
    localStorage.removeItem(CLAVE);
    GUARDADO = {resp: {}, instalada: false};
    document.getElementById("aviso-nueva").hidden = true;
    ir("#/", true);
    document.getElementById("estado-limpieza").textContent = "Se borraron la caché y todas las respuestas. Para preparar de nuevo el uso sin conexión, cerrá y volvé a abrir la app con internet.";
  } catch(e) {
    boton.disabled = false;
    estado.textContent = "No se pudo completar el borrado. Volvé a intentarlo. Si el navegador bloquea el almacenamiento, revisá sus permisos.";
  } finally {
    borrandoTodo = false;
  }
}

        ico("adelante", "chev")), info.color));

  }
  $vista.appendChild(el("h2", {class: "seccion", text: rotuloParcial(numero === undefined ? parciales[0] : numero)}));
  m.examenes.filter(ex => numero === undefined || parcialDe(ex) === numero).forEach(ex => {

        cls ? ico(cls === "ok" ? "check" : "cruz") : null, t.n, estado ? el("small", {text: estado}) : null));
    });

function primeraPendiente(t){
  const r = respuestas(t);
  const i = t.qs.findIndex((q, i) => !completa(q, r[i]));

}

function pintarTema(m, t, pos){
  const ex = t._ex;
  const r = respuestas(t);
  let idx = pos === "fin" ? t.qs.length : Math.max(0, Math.min(t.qs.length, (parseInt(pos, 10) || 1) - 1));
  const base = "#/" + [m.id, ex.id, t.id].join("/");
  const a = i => ir(base + "/" + (i >= t.qs.length ? "fin" : i + 1), true);

  barra((m.sigla || m.nombre) + (parcialesDe(m).length > 1 ? " · " + rotuloParcial(parcialDe(ex)) : ""), rutaListado(m, ex));
  document.title = t.n + " · " + ex.nombre;
  $vista.innerHTML = "";
  $vista.appendChild(el("h1", {text: ex.nombre + " · " + t.n}));
  const s = resumen(t);
  $vista.appendChild(el("p", {class: "sub", text: m.nombre + " · " + s.n + " ejercicios · " + s.hechas + (s.hechas === 1 ? " respondido" : " respondidos")}));

  t.qs.forEach((q, i) => {
    let cls = "";
    if (completa(q, r[i])) cls = correcta(q, r[i]) ? "ok" : "bad";
    else if (r[i] !== null) cls = "parcial";
    if (i === idx) cls += " now";
    g.appendChild(el("button", {class: cls, onclick: () => a(i), "aria-label": "Ejercicio " + etiqueta(q, i), text: etiqueta(q, i)}));
  });
  g.appendChild(el("button", {class: "fin" + (idx === t.qs.length ? " now" : ""), onclick: () => a(t.qs.length), "aria-label": "Ver la nota"}, ico("trofeo"), "Nota"));
  $vista.appendChild(g);

  if (idx >= t.qs.length) pintarResultado(m, t, a);
  else pintarConsigna(m, t, idx, a);

  $pie.appendChild(el("p", {}, el("button", {class: "enlace", onclick: () => {
    if (!confirm("¿Borrar todas las respuestas de " + t.n + "?")) return;
    GUARDADO.resp[t._clave] = t.qs.map(vacia); guardar(); a(0);
  }}, ico("papelera"), "Borrar las respuestas de este tema")));

function pintarConsigna(m, t, idx, a){
  const q = t.qs[idx], r = respuestas(t), dada = r[idx];
  const lista = completa(q, dada);
  const card = el("div", {class: "card"});

    el("span", {text: "Ejercicio " + etiqueta(q, idx) + (q.u ? " · " + q.u : "")}),
    el("span", {text: ptsTxt(q.pts)})));

  if (q.ctx) {
    const grupo = t.qs.filter(x => x.ctx === q.ctx).map(x => etiqueta(x, t.qs.indexOf(x)));
    const det = el("details", {class: "ctx"},
      el("summary", {}, ico("libro"),
        el("span", {text: q.contextoTitulo || "Texto para " + (grupo.length > 1 ? "los ejercicios " + grupo.slice(0, -1).join(", ") + " y " + grupo[grupo.length - 1] : "este ejercicio")}),
        ico("adelante", "chev")),

    if (!lista) det.open = true;

      el("p", {text: q.pista})));
  }

  const elegir = (j, i) => {
    if (q.elegir) {
      const v = Array.isArray(r[idx]) ? r[idx].filter(x => x !== i) : [];
      if (v.length === (Array.isArray(r[idx]) ? r[idx].length : 0)) v.push(i);   // no estaba: se marca
      r[idx] = v.length ? v.sort((x, y) => x - y) : null;
    } else if (q.partes) {
      const v = Array.isArray(r[idx]) ? r[idx].slice() : q.partes.map(() => null);
      v[j] = i; r[idx] = v;
    } else r[idx] = i;
    guardar(); a(idx);
  };
  const botones = (bloque, marcada, j) => el("div", {class: "ops"}, bloque.o.map((txt, i) => {
    const b = el("button", {class: "op"},
      bloque.formato === "texto" ? null : el("span", {class: "l", text: etiquetaOpcion(q, bloque, i) + "."}),
      el("span", {class: "t", text: txt}));
    if (lista) {
      b.disabled = true;
      const elegida = Array.isArray(marcada) ? marcada.includes(i) : i === marcada;
      b.className = "op " + (indiceCorrecto(bloque, i) ? "ok" : elegida ? "bad" : "resto");
    } else {
      if (Array.isArray(marcada) ? marcada.includes(i) : i === marcada) b.className = "op sel";
      if (q.elegir) b.setAttribute("aria-pressed", String(b.className.includes("sel")));
      b.onclick = () => elegir(j, i);
    }

  }));

  if (q.partes) {
    if (!lista) card.appendChild(el("p", {class: "ayuda", text: "Elegí una opción en cada " + (q.partes.length === 2 ? "una de las dos partes" : "parte") + ". Se corrige al completar todas: no hay puntaje parcial."}));
    q.partes.forEach((p, j) => {
      const marcada = Array.isArray(dada) ? dada[j] : null;
      card.appendChild(el("div", {class: "parte"},
        el("p", {class: "rot", text: p.r || (j === 0 ? "Primera columna" : j === 1 ? "Segunda columna" : "Parte " + (j + 1))}),
        botones(p, marcada, j)));
    });
  } else if (q.elegir) {
    if (!lista) card.appendChild(el("p", {class: "ayuda", text: "Marcá " + (q.elegir === 2 ? "dos opciones" : q.elegir + " opciones") +
      ". Se corrige al marcar la " + (q.elegir === 2 ? "segunda" : "última") + "; antes podés desmarcar tocando de nuevo. No hay puntaje parcial."}));
    card.appendChild(botones(q, Array.isArray(dada) ? dada : [], 0));
  } else {
    card.appendChild(botones(q, dada, 0));
  }

  if (lista) {
    const ok = correcta(q, dada);
    const letras = q.partes ? q.partes.map(p => etiquetaCorrectas(q, p)).join(" y ") : etiquetaCorrectas(q, q);
    const suyas = q.elegir ? dada.map(x => etiquetaOpcion(q, q, x)).join(" y ")
      : q.partes ? dada.map((x, j) => etiquetaOpcion(q, q.partes[j], x)).join(" y ") : etiquetaOpcion(q, q, dada);
    const caja = el("div", {class: "porque"},
      el("b", {class: ok ? "ok" : "bad"}, ico(ok ? "check-circulo" : "cruz"),
        el("span", {text: ok ? "Correcto: " + letras : "Incorrecto. Correcta: " + letras + " (marcaste " + suyas + ")"})),
      el("div", {class: "exp"}, ico("foco", "c-note"), el("span", {text: (m.notas && m.notas[q.k]) || ""})));
    card.appendChild(caja);
    if (q.d) card.appendChild(el("div", {class: "dudosa"}, ico("alerta"), el("span", {text: typeof q.d === "string" ? q.d :
      "Clave a confirmar: el parcial original no traía esta respuesta marcada y se dedujo de la bibliografía. Si podés, verificala con la cátedra o con tus apuntes."})));
  }

  const nav = el("div", {class: "nav"},
    el("button", {disabled: idx === 0, onclick: () => a(idx - 1)}, ico("atras"), "Anterior"),
    el("button", {class: "main", onclick: () => a(idx + 1)},
      idx === t.qs.length - 1 ? "Ver nota" : "Siguiente", ico(idx === t.qs.length - 1 ? "trofeo" : "adelante")));
  card.appendChild(nav);
  $vista.appendChild(card);
}

function pintarResultado(m, t, a){

/* ---------- pie de las pantallas generales ---------- */
const INST = {evento: null, ios: /iphone|ipad|ipod/i.test(navigator.userAgent),
  android: /android/i.test(navigator.userAgent),
  instalada: matchMedia("(display-mode: standalone)").matches || navigator.standalone === true || GUARDADO.instalada};
function pintarCartel(){
  const lugar = document.getElementById("cartel-inst");
  if (!lugar) return;
  lugar.innerHTML = "";
  if (INST.instalada) return;

  const ayuda = el("div", {class: "inst-ayuda", hidden: ""});

    ayuda.hidden = !ayuda.hidden;

  };
  const instalar = () => {

      if (r.outcome !== "accepted") { abrirAyuda(); pintarCartel(); }

  };

  const boton = el("button", {class: "btn-inst", onclick: instalar},
    ico(INST.evento ? "descargar" : "celular"), INST.evento ? "Instalar aplicación" : "Cómo instalarla");

  const pasos = INST.ios

      : ["Abrí el menú del navegador.", "Buscá «Instalar aplicación» o el ícono de instalación en la barra de direcciones.", "Confirmá la instalación."];
  ayuda.appendChild(el("p", {text: INST.android ? "Si abriste el enlace desde WhatsApp u otra app, primero elegí «Abrir en Chrome»." : "Seguí estos pasos en tu navegador:"}));

/* ---------- teclado (en la computadora) ---------- */
document.addEventListener("keydown", ev => {
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const partes = location.hash.replace(/^#\/?/, "").split("/");
  if (partes.length < 4 || partes[3] === "fin") return;
  const m = MATERIAS[partes[0]];
  const ex = m && m.examenes.find(e => e.id === partes[1]);
  const t = ex && ex.temas.find(t => t.id === partes[2]);
  if (!t) return;
  const idx = (parseInt(partes[3], 10) || 1) - 1, q = t.qs[idx];
  const base = "#/" + partes.slice(0, 3).join("/") + "/";
  if (ev.key === "ArrowRight") ir(base + (idx + 1 >= t.qs.length ? "fin" : idx + 2), true);
  else if (ev.key === "ArrowLeft" && idx > 0) ir(base + idx, true);
  else if (!q.partes) {
    const i = q.formato === "numeros" ? "12345678".indexOf(ev.key) : L.indexOf(ev.key.toUpperCase());
    const r = respuestas(t);
    if (i < 0 || i >= q.o.length || completa(q, r[idx])) return;
    if (q.elegir) {
      const v = (r[idx] || []).includes(i) ? r[idx].filter(x => x !== i) : (r[idx] || []).concat(i);
      r[idx] = v.length ? v.sort((x, y) => x - y) : null;
      guardar(); pintar();
    } else if (r[idx] === null) { r[idx] = i; guardar(); pintar(); }
  }
});

/* ============================================================
   app instalable: funciona sin internet y avisa si hay versión nueva
   ============================================================ */
(function(){
  if (!("serviceWorker" in navigator) || !/^https?:$/.test(location.protocol)) return;
  const aviso = document.getElementById("aviso-nueva");
  let esperando = null, pidio = false, recargando = false;
  const mostrar = sw => { esperando = sw; aviso.hidden = false; };
  document.getElementById("btn-actualizar").onclick = () => {
    if (!esperando) return location.reload();
    document.getElementById("btn-actualizar").disabled = true;
    pidio = true;
    esperando.postMessage({tipo: "activar"});
  };
  document.getElementById("btn-despues").onclick = () => { aviso.hidden = true; };
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!pidio || recargando) return;
    recargando = true;
    location.reload();
  });
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then(reg => {
      if (reg.waiting && navigator.serviceWorker.controller) mostrar(reg.waiting);
      reg.addEventListener("updatefound", () => {
        const nuevo = reg.installing;
        if (!nuevo) return;
        nuevo.addEventListener("statechange", () => {
          if (nuevo.state === "installed" && navigator.serviceWorker.controller) mostrar(nuevo);
        });
      });
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") reg.update().catch(() => {});
      });
    }).catch(() => {});
  });
})();
